<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Lobby Hub</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 8px; display: inline-block; margin: 10px; width: 250px; vertical-align: top; }
        button { background: #00ea43; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; color: #121212; }
        input { padding: 10px; border-radius: 5px; border: none; margin-bottom: 10px; width: 80%; text-align: center; }
        #gameArea { display: none; background: #2a2a2a; margin-top: 30px; padding: 30px; border-radius: 12px; }
    </style>
    <!-- IMPORTS SUPABASE INTO THE BROWSER -->
    <script src="js/app.js"></script>
</head>
<body>
    <h1>🎮 The Games Place Hub</h1>
    
    <!-- LOBBY SETUP VIEW -->
    <div id="setupArea">
        <div class="box">
            <h3>Host a Game</h3>
            <button onclick="createLobby()">Create Lobby</button>
        </div>
        <div class="box">
            <h3>Join a Friend</h3>
            <input type="text" id="lobbyCodeInput" placeholder="4-Letter Code" maxlength="4">
            <button onclick="joinLobby()">Join Lobby</button>
        </div>
    </div>

    <!-- ACTIVE LOBBY ROOM VIEW -->
    <div id="gameArea">
        <h2>Lobby Code: <span id="currentRoomCode" style="color:#00ea43;">----</span></h2>
        <p id="status">Waiting for players to connect...</p>
        
        <!-- Placeholder for chat / gameplay -->
        <div style="background:#121212; padding: 20px; min-height: 100px; border-radius: 6px;" id="chatBox">
            <p style="color:#888;">Lobby activity logs will appear here.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
